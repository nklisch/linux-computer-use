[package]
name = "linux-computer-use"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Persistent, permissioned Linux desktop control for local agents (KDE/Wayland)"
license = "MIT"
repository = "https://github.com/nklisch/linux-computer-use"
readme = "README.md"

[[bin]]
name = "lcu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
rmcp = { version = "=3.1.4", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tempfile = "3"
wayland-client = "0.31.15"
xkbcommon = { version = "0.9", default-features = false }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
